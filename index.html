<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span>calculator</span>
      </div>
      <div class="top-actions">
        <button class="icon-button" aria-label="theme">✦</button>
        <button class="icon-button" aria-label="options">◌</button>
      </div>
    </div>

    <main class="calculator-shell">
      <div class="display" id="display">0</div>

      <div class="keypad" aria-label="calculator keypad">
        <button class="key function">2nd</button>
        <button class="key function">n</button>
        <button class="key function">e</button>
        <button class="key function">AC</button>
        <button class="key function">x²</button>
        <button class="key function">1/x</button>
        <button class="key function">|x|</button>
        <button class="key function">exp</button>

        <button class="key function">mod</button>
        <button class="key function">X</button>
        <button class="key function">(</button>
        <button class="key function">)</button>
        <button class="key function">n!</button>
        <button class="key function">xʸ</button>
        <button class="key function">sin</button>
        <button class="key function">cos</button>

        <button class="key function">tan</button>
        <button class="key function">log</button>
        <button class="key function">⌫</button>
        <button class="key function">^</button>
        <button class="key function">÷</button>
        <button class="key function">%</button>
        <button class="key operator">×</button>

        <button class="key operator">−</button>
        <button class="key number">π</button>
        <button class="key number">7</button>
        <button class="key number">8</button>
        <button class="key number">9</button>
        <button class="key number">4</button>
        <button class="key number">5</button>
        <button class="key number">6</button>

        <button class="key operator">+</button>
        <button class="key number">1</button>
        <button class="key number">2</button>
        <button class="key number">3</button>
        <button class="key function">AC</button>
        <button class="key number">0</button>
        <button class="key number">.</button>

        <button class="key equals">=</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
